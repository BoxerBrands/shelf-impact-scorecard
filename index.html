<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Get the Shelf Impact Scorecard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&family=Sofia+Sans+Extra+Condensed:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --black: #0a0a0a;
      --white: #ffffff;
      --grey: #9a9a9a;
      --blue: #4472c4;
      --blue-dark: #345a9e;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100vh;
      background: var(--black);
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: 'Figtree', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .wrap {
      width: 100%;
      max-width: 1100px;
    }
    .logo-stage {
      container-type: inline-size;
      position: relative;
      width: 100%;
      aspect-ratio: 2000 / 702;
    }
    .logo-stage img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    /* Overlay positioned exactly over the box in the logo artwork (measured in px against the 2000x702 source) */
    .overlay {
      position: absolute;
      left: calc(458 / 2000 * 100%);
      top: calc(176 / 702 * 100%);
      width: calc((982 - 458) / 2000 * 100%);
      height: calc((525 - 176) / 702 * 100%);
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-start;
      text-align: left;
      gap: 1.1cqw;
      padding: 4.5cqw 1.1cqw 1.1cqw;
      overflow: hidden;
    }
    h1 {
      margin: 0;
      color: var(--blue);
      font-family: 'Sofia Sans Extra Condensed', sans-serif;
      font-weight: 800;
      font-size: 5.2cqw;
      line-height: 0.82;
      letter-spacing: 0;
      text-transform: uppercase;
    }
    form {
      display: flex;
      flex-direction: row;
      gap: 0.5cqw;
      width: 100%;
    }
    input[type="email"] {
      flex: 1 1 auto;
      min-width: 0;
      padding: 0.65cqw 0.8cqw;
      border: none;
      font-size: 0.85cqw;
      outline: none;
      background: #e4e4e4;
      color: #444;
      font-family: 'Figtree', sans-serif;
      font-weight: 400;
    }
    input[type="email"]:focus { outline: 0.07cqw solid var(--blue); }
    button {
      flex: 0 0 auto;
      padding: 0.65cqw 1cqw;
      border: none;
      background: var(--blue);
      color: var(--white);
      font-size: 0.85cqw;
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      cursor: pointer;
      font-family: 'Figtree', sans-serif;
    }
    button:hover:not(:disabled) { background: var(--blue-dark); }
    button:disabled { opacity: 0.6; cursor: default; }

    .below {
      margin-top: 22px;
      text-align: center;
    }
    .msg {
      font-size: 14px;
      line-height: 1.4;
      display: none;
      font-weight: 600;
      color: var(--white);
      margin-bottom: 10px;
    }
    .msg.show { display: block; }
    .fine {
      font-size: 13px;
      color: var(--grey);
      font-weight: 400;
      font-family: 'Figtree', sans-serif;
    }
    .fine .sep {
      margin: 0 10px;
      color: #444;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo-stage">
      <img src="/boxer-logo.png" alt="Boxer" />
      <div class="overlay">
        <h1>Get your scorecard</h1>
        <form id="signup-form">
          <input type="email" id="email" name="email" placeholder="email goes here" required autocomplete="email" />
          <button type="submit" id="submit-btn">Send</button>
        </form>
      </div>
    </div>
    <div class="below">
      <div class="msg" id="msg"></div>
      <p class="fine">We will only use your email to send this<span class="sep">|</span>No spam</p>
    </div>
  </div>

  <script>
    const form = document.getElementById('signup-form');
    const button = document.getElementById('submit-btn');
    const msg = document.getElementById('msg');

    function showMessage(text) {
      msg.textContent = text;
      msg.className = 'msg show';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      if (!email) return;

      button.disabled = true;
      button.textContent = '...';
      msg.className = 'msg';

      try {
        const res = await fetch('/api/subscribe', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email }),
        });
        const data = await res.json();

        if (res.ok) {
          showMessage("Check your inbox — we've sent the PDF to " + email + ".");
          form.reset();
        } else {
          showMessage(data.error || 'Something went wrong. Please try again.');
        }
      } catch (err) {
        showMessage('Something went wrong. Please try again.');
      } finally {
        button.disabled = false;
        button.textContent = 'Send';
      }
    });
  </script>
</body>
</html>
