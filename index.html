<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Get the Shelf Impact Scorecard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&family=Sofia+Sans+Extra+Condensed:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --black: #0a0a0a;
      --white: #ffffff;
      --grey: #9a9a9a;
      --blue: #4472c4;
      --blue-dark: #345a9e;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100vh;
      background: var(--black);
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: 'Figtree', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .wrap {
      width: 100%;
      max-width: 1500px;
    }
    .logo-stage {
      container-type: inline-size;
      position: relative;
      width: 100%;
      aspect-ratio: 2000 / 702;
    }
    .logo-stage .full-logo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    .logo-stage .stack-logo {
      display: none;
    }
    /* Overlay positioned exactly over the box in the logo artwork (measured in px against the 2000x702 source) */
    .overlay {
      container-type: inline-size;
      position: absolute;
      left: calc(458 / 2000 * 100%);
      top: calc(176 / 702 * 100%);
      width: calc((982 - 458) / 2000 * 100%);
      height: calc((525 - 176) / 702 * 100%);
      overflow: hidden;
    }
    .box-content {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-start;
      text-align: left;
      width: 100%;
      height: 100%;
      gap: 4.2cqw;
      padding: 17.18cqw 4.2cqw 4.2cqw;
    }
    h1 {
      margin: 0;
      color: var(--blue);
      font-family: 'Sofia Sans Extra Condensed', sans-serif;
      font-weight: 800;
      font-size: 19.85cqw;
      line-height: 0.82;
      letter-spacing: 0;
      text-transform: uppercase;
    }
    form {
      display: flex;
      flex-direction: row;
      gap: 1.91cqw;
      width: 100%;
    }
    input[type="email"] {
      flex: 1 1 auto;
      min-width: 0;
      padding: 2.48cqw 3.05cqw;
      border: none;
      font-size: 3.24cqw;
      outline: none;
      background: #e4e4e4;
      color: #444;
      font-family: 'Figtree', sans-serif;
      font-weight: 400;
    }
    input[type="email"]:focus { outline: 0.27cqw solid var(--blue); }
    button {
      flex: 0 0 auto;
      padding: 2.48cqw 3.82cqw;
      border: none;
      background: var(--blue);
      color: var(--white);
      font-size: 3.24cqw;
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      cursor: pointer;
      font-family: 'Figtree', sans-serif;
    }
    button:hover:not(:disabled) { background: var(--blue-dark); }
    button:disabled { opacity: 0.6; cursor: default; }

    .below {
      margin-top: 22px;
      text-align: center;
    }
    .msg {
      font-size: 14px;
      line-height: 1.4;
      display: none;
      font-weight: 600;
      color: var(--white);
      margin-bottom: 10px;
    }
    .msg.show { display: block; }
    .fine {
      font-size: 13px;
      color: var(--grey);
      font-weight: 400;
      font-family: 'Figtree', sans-serif;
    }
    .fine .sep {
      margin: 0 10px;
      color: #444;
    }

    /* Mobile: the supplied stacked logo (1414x1270 crop), box measured from the source file */
    @media (max-width: 700px) {
      body { padding: 20px 0; }
      .wrap {
        position: relative;
        width: 73.9vw;
        transform: translateY(-6.6vh);
      }
      .logo-stage { aspect-ratio: 1414 / 1270; }
      .logo-stage .full-logo { display: none; }
      .logo-stage .stack-logo {
        display: block;
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .overlay {
        left: calc(488 / 1414 * 100%);
        top: calc(2 / 1270 * 100%);
        width: calc(908 / 1414 * 100%);
        height: calc(605 / 1270 * 100%);
      }
      .below {
        position: absolute;
        top: 100%;
        left: 50%;
        transform: translateX(-50%);
        width: 100vw;
        padding: 0 16px;
        margin-top: 12.2vw;
      }
      .fine {
        margin: 0;
        font-size: 1.65vw;
      }
      .fine .sep { margin: 0 1.27vw; }
      .box-content {
        gap: 0.6cqw;
        padding: 9.05cqw 3.9cqw 3.5cqw;
      }
      h1 {
        font-size: 22.1cqw;
        font-weight: 900;
        line-height: 0.838;
      }
      form {
        flex-direction: column;
        gap: 1.85cqw;
      }
      input[type="email"] {
        width: 100%;
        height: 8.4cqw;
        font-size: 4.3cqw;
        padding: 0 2.3cqw;
      }
      button {
        width: 100%;
        height: 6.4cqw;
        font-size: 4.1cqw;
        line-height: 1;
        padding: 0;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo-stage">
      <img class="full-logo" src="/boxer-logo.png" alt="Boxer" />
      <img class="stack-logo" src="/boxer-logo-stacked.png" alt="Boxer" />
      <div class="overlay">
        <div class="box-content">
          <h1>Get your scorecard</h1>
          <form id="signup-form">
            <input type="email" id="email" name="email" placeholder="email goes here" required autocomplete="email" />
            <button type="submit" id="submit-btn">Send</button>
          </form>
        </div>
      </div>
    </div>
    <div class="below">
      <div class="msg" id="msg"></div>
      <p class="fine">We will only use your email to send this<span class="sep">|</span>No spam</p>
    </div>
  </div>

  <script>
    const form = document.getElementById('signup-form');
    const button = document.getElementById('submit-btn');
    const msg = document.getElementById('msg');

    function showMessage(...lines) {
      msg.textContent = '';
      lines.forEach((line, i) => {
        if (i > 0) msg.appendChild(document.createElement('br'));
        msg.appendChild(document.createTextNode(line));
      });
      msg.className = 'msg show';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      if (!email) return;

      button.disabled = true;
      button.textContent = '...';
      msg.className = 'msg';

      try {
        const res = await fetch('/api/subscribe', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email }),
        });
        const data = await res.json();

        if (res.ok) {
          showMessage("Check your inbox, we've sent the PDF to " + email, "If you don't receive it, please check your spam folder");
          form.reset();
        } else {
          showMessage(data.error || 'Something went wrong. Please try again.');
        }
      } catch (err) {
        showMessage('Something went wrong. Please try again.');
      } finally {
        button.disabled = false;
        button.textContent = 'Send';
      }
    });
  </script>
</body>
</html>
